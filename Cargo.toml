[package]
name = "llmctx"
version = "0.1.0"
edition = "2024"
default-run = "llme"
description = "Local-first CLI for exporting LLM coding sessions to Markdown"
license = "MIT"
repository = "https://github.com/francofl99/llm-context-export"
readme = "README.md"
keywords = ["cli", "llm", "claude", "markdown", "export"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "llme"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
